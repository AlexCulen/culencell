<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alex Culen | Reparación de celulares</title><meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060f;--panel:#120f24;--line:#2a2250;--ink:#f1edff;--mute:#a79fd0;--violet:#a855f7;--blue:#38bdf8;--pink:#e879f9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.6}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(7,6,15,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:800;letter-spacing:.02em;text-decoration:none}
.logo span{color:var(--violet)}
nav a{margin-left:20px;text-decoration:none;color:var(--mute);font-size:.92rem}
nav a:hover,nav a:focus-visible{color:var(--ink)}
.hero{position:relative;padding:84px 0 72px;overflow:hidden}
.hero::before{content:"";position:absolute;width:560px;height:560px;right:-160px;top:-120px;background:radial-gradient(circle,rgba(168,85,247,.45),rgba(56,189,248,.12) 55%,transparent 70%);pointer-events:none}
.hero .wrap{position:relative;display:grid;gap:40px;grid-template-columns:1.2fr .8fr;align-items:center}
h1{font-size:clamp(2.3rem,6vw,4.1rem);line-height:1.05;margin:0 0 18px;font-weight:800;letter-spacing:-.02em}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--violet),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--mute);max-width:46ch;margin:0 0 28px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:13px 22px;border-radius:12px;font-weight:600;text-decoration:none;border:1px solid var(--line)}
.btn.main{background:linear-gradient(90deg,var(--violet),#6366f1);border-color:transparent;box-shadow:0 0 28px rgba(168,85,247,.45)}
.btn:hover,.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.screen{justify-self:center;width:230px;aspect-ratio:9/18;border-radius:34px;border:3px solid #3b3270;background:linear-gradient(160deg,#1b1240,#0b2a4a);position:relative;box-shadow:0 0 60px rgba(168,85,247,.35);display:grid;place-items:center;text-align:center;padding:20px}
.screen::before{content:"";position:absolute;top:10px;left:50%;width:60px;height:7px;margin-left:-30px;border-radius:9px;background:#07060f}
.screen b{display:block;font-size:1.15rem;color:var(--blue)}
.screen small{color:var(--mute)}
.bolt{font-size:3rem;filter:drop-shadow(0 0 14px var(--violet))}
section{padding:64px 0}
h2{font-size:clamp(1.6rem,3.5vw,2.2rem);margin:0 0 10px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 34px;max-width:56ch}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.card h3{margin:0 0 6px;font-size:1.05rem;color:var(--blue)}
.card p{margin:0;color:var(--mute);font-size:.94rem}
.reels{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.reel{display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:9/14;border-radius:18px;padding:18px;text-decoration:none;border:1px solid var(--line);position:relative;overflow:hidden}
.reel::after{content:"▶";position:absolute;top:14px;right:16px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:rgba(7,6,15,.65);font-size:.8rem}
.reel strong{font-size:1.05rem;position:relative}
.reel span{font-size:.85rem;color:#d7d0ff;position:relative}
.r1{background:linear-gradient(180deg,#0e63c9,#06223f)}
.r2{background:linear-gradient(180deg,#5b1aa6,#10062a)}
.r3{background:linear-gradient(180deg,#f59e0b,#7c2d12)}
.r4{background:linear-gradient(180deg,#1e6f9f,#7a1d1d)}
.reel:hover,.reel:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
.contact{border:1px solid var(--line);border-radius:22px;padding:34px;background:linear-gradient(135deg,rgba(168,85,247,.16),rgba(56,189,248,.08))}
.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
footer{padding:30px 0 44px;color:var(--mute);font-size:.85rem;border-top:1px solid var(--line)}
@media(max-width:760px){.hero .wrap{grid-template-columns:1fr}.screen{width:190px}nav a:not(:last-child){display:none}}
@media(prefers-reduced-motion:no-preference){.screen{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}}

.media{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.media img,.media video,.vcard video{width:100%;border-radius:16px;border:1px solid var(--line);background:#000;display:block}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px}
.vcard strong{display:block;margin:10px 6px 0}.vcard span{margin:0 6px 6px;display:block;font-size:.85rem;color:var(--mute)}
</style></head><body>
<header><div class="wrap"><a class="logo" href="#">Alex<span>Culen</span></a><nav id="nav"></nav></div></header>
<main id="app"></main>
<footer><div class="wrap">© 2026 Alex Culen · Reparación de celulares</div></footer>
<script>
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('content.json?'+Date.now()).then(r=>r.json()).then(d=>{
const wa='https://wa.me/'+e(d.wa)+'?text='+encodeURIComponent('Hola Alex, quiero consultar por una reparación');
const reels=(d.reels||[]).map((r,i)=>r.src
?`<div class="vcard"><video controls playsinline preload="metadata" src="${e(r.src)}"></video><strong>${e(r.title)}</strong><span>${e(r.sub)}</span></div>`
:`<a class="reel r${i%4+1}" href="${e(r.url)}" target="_blank" rel="noopener"><strong>${e(r.title)}</strong><span>${e(r.sub)}</span></a>`).join('');
const secs=(d.sections||[]).map(s=>`<section><div class="wrap"><h2>${e(s.title)}</h2><p class="sub">${e(s.text)}</p><div class="media">${(s.media||[]).map(m=>m.type==='video'?`<video controls playsinline preload="metadata" src="${e(m.src)}"></video>`:`<img loading="lazy" alt="${e(s.title)}" src="${e(m.src)}">`).join('')}</div></div></section>`).join('');
document.getElementById('nav').innerHTML='<a href="#servicios">Servicios</a><a href="#trabajos">Trabajos</a><a href="#contacto">Contacto</a>';
document.getElementById('app').innerHTML=`
<div class="hero"><div class="wrap"><div><h1>${e(d.hero.title)} <em>${e(d.hero.accent)}</em></h1><p class="lead">${e(d.hero.lead)}</p>
<div class="btns"><a class="btn main" href="${wa}" target="_blank" rel="noopener">Pedir presupuesto</a><a class="btn" href="#trabajos">Ver trabajos</a></div></div>
<div class="screen" aria-hidden="true"><div><div class="bolt">⚡</div><b>Reparación lista</b><small>Samsung · Motorola · iPhone</small></div></div></div></div>
<section id="servicios"><div class="wrap"><h2>Qué reparo</h2><p class="sub">${e(d.servicesIntro)}</p><div class="grid">${(d.services||[]).map(s=>`<div class="card"><h3>${e(s.t)}</h3><p>${e(s.d)}</p></div>`).join('')}</div></div></section>
<section id="trabajos"><div class="wrap"><h2>Mis trabajos</h2><p class="sub">${e(d.worksIntro)}</p><div class="reels">${reels}</div></div></section>
${secs}
<section id="contacto"><div class="wrap"><div class="contact"><h2>Contacto</h2><p class="sub" style="margin-bottom:0">${e(d.contactText)}</p><div class="links">
<a class="btn main" href="${wa}" target="_blank" rel="noopener">WhatsApp ${e(d.phone)}</a>
<a class="btn" href="https://ig.me/m/${e(d.ig)}" target="_blank" rel="noopener">Mensaje en Instagram</a>
<a class="btn" href="https://www.instagram.com/${e(d.ig)}/" target="_blank" rel="noopener">@${e(d.ig)}</a>
${d.threads?`<a class="btn" href="https://www.threads.net/@${e(d.threads)}" target="_blank" rel="noopener">Threads @${e(d.threads)}</a>`:''}
</div></div></div></section>`;
}).catch(()=>{document.getElementById('app').innerHTML='<div class="wrap" style="padding:80px 22px">No se pudo cargar el contenido.</div>'});
</script></body></html>
